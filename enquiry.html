<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Student Stay SA helps students explore accommodation options near campus.">
<title>Enquiry | Student Stay SA</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header"><div class="container header-inner">
<a class="logo" href="index.html">Student Stay SA</a>
<nav aria-label="Main navigation"><ul class="nav-list"><li><a class="" href="index.html">Home</a></li><li><a class="" href="listings.html">Listings</a></li><li><a class="" href="about.html">About Us</a></li><li><a class="active" href="enquiry.html">Enquiry</a></li><li><a class="" href="contact.html">Contact</a></li></ul></nav>
</div></header>
<main><section class="page-banner"><div class="container"><h1>Accommodation Enquiry</h1><p>Tell us what type of accommodation you are looking for.</p></div></section>
<section><div class="container"><form action="#" method="post"><div class="form-grid">
<div class="form-group"><label for="name">Full name</label><input id="name" name="name" type="text" required></div>
<div class="form-group"><label for="email">Email address</label><input id="email" name="email" type="email" required></div>
<div class="form-group"><label for="campus">Campus / institution</label><select id="campus" name="campus" required><option value="">Select an option</option><option>Rosebank College</option><option>University of Johannesburg</option><option>Wits University</option><option>Other</option></select></div>
<div class="form-group"><label for="budget">Monthly budget</label><select id="budget" name="budget" required><option value="">Select a budget</option><option>Below R3,000</option><option>R3,000 - R3,500</option><option>R3,501 - R4,000</option><option>Above R4,000</option></select></div>
<div class="form-group full"><label for="message">Enquiry message</label><textarea id="message" name="message" required></textarea></div>
</div><div class="form-actions"><button class="button" type="submit">Submit Enquiry</button><button class="button secondary" type="reset">Clear Form</button></div>
</form></div></section></main>
<footer class="site-footer"><div class="container footer-inner">
<p>&copy; 2026 Student Stay SA. Academic project.</p><p><a href="contact.html">Contact Student Stay SA</a></p>
</div></footer>
</body></html>
